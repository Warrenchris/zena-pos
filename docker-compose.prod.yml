# Production Docker Compose for Zana POS
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  # MySQL Production Database
  mysql:
    image: mysql:8.0
    container_name: zana-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-zana_pos}
      MYSQL_USER: ${DB_USER:-zana_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=caching_sha2_password
      --max_connections=300
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - zana-internal-net

  # Redis Production Cache
  redis:
    image: redis:7-alpine
    container_name: zana-redis-prod
    volumes:
      - redis_prod_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-zana_secure_redis_pwd}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zana_secure_redis_pwd}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - zana-internal-net

  # Backend Production Service (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: zana-backend-prod
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-zana_pos}
      DB_USER: ${DB_USER:-zana_app}
      DB_PASS: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zana_secure_redis_pwd}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # No deploy workflow exists in this repo yet, so this can't be set
      # automatically to the commit SHA the way the frontend build does it.
      # Export it yourself before `docker compose up`, e.g.:
      #   SENTRY_RELEASE=zana-pos-backend@$(git rev-parse HEAD) docker compose -f docker-compose.prod.yml up -d --build
      # Left blank here on purpose: instrument.js's own fallback
      # (zana-pos-backend@<package.json version>) is more honest than a
      # second hardcoded guess would be.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    volumes:
      # Read-only: the backend only reports on backups here, it never writes.
      # backup-scheduler (below) is the only service that writes to this volume.
      - mysql_prod_backups:/app/backups:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - zana-internal-net

  # Frontend Production Service (Static Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: zana-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - zana-internal-net

  # Automated Database Backup Scheduler (OPS-P2-01)
  backup-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: zana-backup-scheduler-prod
    command: ["node", "scripts/backup-scheduler.js"]
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-zana_pos}
      DB_USER: ${DB_USER:-zana_app}
      DB_PASS: ${DB_PASSWORD}
      BACKUP_DIR: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - mysql_prod_backups:/app/backups
      - ./scripts:/app/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zana-internal-net

volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  mysql_prod_backups:
    driver: local

networks:
  zana-internal-net:
    driver: bridge
