[tool.poetry]
name = "zana-ai-service"
version = "0.1.0"
description = "AI Financial Helper for Zana"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
pandas = "^2.0.3"
numpy = "^1.25.1"
scikit-learn = "^1.3.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
prophet = "^1.1.4"
python-dotenv = "^1.0.0"
pydantic = "^2.1.1"
sqlalchemy = "^2.0.19"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"