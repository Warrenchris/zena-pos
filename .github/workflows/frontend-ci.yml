name: Frontend CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-ci:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint "src/**/*.{js,jsx}"

      - name: Run unit tests
        run: npm test -- --passWithNoTests

      - name: Build frontend (TypeScript & Vite)
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'warrenchris-org' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'zana-pos' }}
          # Must match the version sentry-release.yml creates, so the running
          # app's Sentry.init({release}) and the uploaded source maps agree.
          VITE_SENTRY_RELEASE: zana-pos-frontend@${{ github.sha }}

      - name: Build production frontend Docker image
        run: docker build -f Dockerfile.prod -t zana-frontend-prod-ci .
