name: AI Service CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'ai_service/**'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'ai_service/**'
      - '.github/workflows/ai-service-ci.yml'

jobs:
  ai-service-ci:
    name: AI Service Verification & Docker Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax and import verification
        run: |
          python -m py_compile $(find src -name "*.py")
          python -c "import src.main; print('AI service application module loaded successfully')"

      - name: Run pytest (if tests exist)
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            pytest
          else
            echo "No test suite directory configured yet, skipping pytest execution."
          fi

      - name: Build AI Service Docker image
        run: docker build -t zana-ai-service-ci .
